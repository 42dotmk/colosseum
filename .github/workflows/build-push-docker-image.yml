on:
  workflow_call:
    inputs:
      docker-context:
        required: true
        type: string

      docker-file-path:
        required: true
        type: string

      image-name:
        description: 'Base image name without tag (e.g. ghcr.io/42dotmk/colosseum-senatus). Used to generate sha/branch/semver tags.'
        required: true
        type: string

      docker-tags:
        description: 'Explicit tags to apply (e.g. :latest or :dev). Combined with auto-generated tags.'
        required: true
        type: string

      docker-build-args:
        required: false
        type: string
        default: ''

jobs:
  build_image:
    if: github.event_name == 'pull_request'
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ inputs.docker-tags }}
            ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.docker-build-args }}

  push_image:
    name: Push docker image
    if: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Push production image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file-path }}
          tags: |
            ${{ inputs.docker-tags }}
            ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.docker-build-args }}
          push: true
